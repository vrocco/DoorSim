name: PlatformIO CI

on:
  push:
    branches:
      - agent-dev
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Test Wiegand format catalog
        run: python tools/test_wiegand_formats.py

      - name: Build firmware
        run: platformio run
